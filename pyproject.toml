[project]
name = "patient-journey"
version = "0.1.0"
description = "GenAI Patient Journey Analytics: T2D Treatment Adoption"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Associate Life Sciences Analytics", email = "analytics@example.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "instructor>=1.3.0",
    "litellm>=1.40.0",
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.20.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0",
]
dashboard = [
    "streamlit>=1.35.0",
]

[project.scripts]
generate-data = "patient_journey.generate_data:main"
extract = "patient_journey.extract:main"
validate = "patient_journey.validate:main"
analyze = "patient_journey.analyze:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patient_journey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
